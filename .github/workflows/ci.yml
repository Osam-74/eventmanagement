name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build (dummy client env)
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: dummy
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: dummy
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: dummy.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:0:web:dummy

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      # Unit tests: pure logic, no emulator needed
      - run: npx vitest run tests/unit
        env:
          QR_TOKEN_HMAC_KEY: 'ci-test-secret-key-for-hmac-32bytes!!'
          PIN_PEPPER: 'ci-test-pin-pepper'
          USHER_SESSION_SECRET: 'ci-test-session-secret'
      # Integration + security-rules suites against the Firestore emulator
      - name: Run integration & rules tests (Firestore emulator)
        run: npx firebase emulators:exec --project demo-eventaccess --only firestore "FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 npx vitest run tests/integration tests/rules"
        env:
          QR_TOKEN_HMAC_KEY: 'ci-test-secret-key-for-hmac-32bytes!!'
          PIN_PEPPER: 'ci-test-pin-pepper'
          USHER_SESSION_SECRET: 'ci-test-session-secret'
